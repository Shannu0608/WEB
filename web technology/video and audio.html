<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video and audio</title>
</head>
<body>
    <h1>audio</h1>
    <audio
    controls
    autoplay
    loop
    muted>
  <source src="music.mp3" type="audio/mpeg"></audio>
  <h1>video</h1>
  <video 
  controls
  width="500"
  height="300"
  autoplay
  muted
  loop>
<source src="video.mp4" text="video/mp4"></video>
</body>
</html>
